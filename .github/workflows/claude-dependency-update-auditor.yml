name: Dependency Update Review

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Find pending reviews without invoking Claude or posting comments
        required: true
        default: true
        type: boolean
      pr_number:
        description: Optionally limit a manual run to one open Dependabot PR
        required: false
        type: string

concurrency:
  group: dependency-update-review
  cancel-in-progress: false

jobs:
  find-prs:
    name: Find pending Dependabot reviews
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has-prs: ${{ steps.find.outputs.has-prs }}
      pr-numbers: ${{ steps.find.outputs.pr-numbers }}
    steps:
      - name: Find unreviewed Dependabot pull requests
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          prs=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --label dependencies \
            --author "dependabot[bot]" \
            --state open \
            --limit 100 \
            --json number,comments \
            --jq '[.[] | select(.comments | map(select(.author.login == "claude" or (.body | startswith("<!-- claude-dependabot-review -->")))) | length == 0) | .number]')

          if [ -n "$REQUESTED_PR" ]; then
            if [[ ! "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::pr_number must be a positive integer."
              exit 1
            fi
            prs=$(jq -c --argjson requested "$REQUESTED_PR" \
              'map(select(. == $requested))' <<< "$prs")
          fi

          echo "pr-numbers=$prs" >> "$GITHUB_OUTPUT"
          if [ "$prs" = "[]" ]; then
            echo "has-prs=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-prs=true" >> "$GITHUB_OUTPUT"
          fi

          count=$(jq length <<< "$prs")
          echo "Found $count Dependabot pull request(s) awaiting review." >> "$GITHUB_STEP_SUMMARY"

  review:
    name: Review Dependabot PR #${{ matrix.pr-number }}
    needs: find-prs
    if: ${{ needs.find-prs.outputs.has-prs == 'true' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr-number: ${{ fromJSON(needs.find-prs.outputs.pr-numbers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Review dependency update
        id: review
        uses: anthropics/claude-code-action@v1
        timeout-minutes: 16
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review Dependabot pull request #${{ matrix.pr-number }} in ${{ github.repository }}.

            This is an unattended CI review. Inspect the pull request metadata and diff, then inspect this checkout for the repository's actual use of the updated dependency. Use changelog evidence only when it appears in the pull request body or links supplied there. Do not post to GitHub; a deterministic later step owns delivery.

            Assess the version-change type, affected usage, compatibility risks, and any required follow-up. Ground every verdict-changing claim in the pull request diff/body or a cited repository file. If the evidence is incomplete, choose "Needs investigation" rather than inventing certainty.

            Return exactly one JSON object with no surrounding prose:
            {
              "event": "COMMENT",
              "summary": "<concise Markdown review with a Safe to merge, Needs investigation, or Requires code changes verdict>",
              "comments": []
            }
          claude_args: |
            --model sonnet
            --disallowedTools "AskUserQuestion,Bash(gh pr comment:*),Bash(gh api:*)"
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --json-schema '{"type":"object","properties":{"event":{"type":"string","enum":["COMMENT"]},"summary":{"type":"string","minLength":1},"comments":{"type":"array","maxItems":0}},"required":["event","summary","comments"]}'

      - name: Post dependency review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr-number }}
          STRUCTURED_OUTPUT: ${{ steps.review.outputs.structured_output }}
        run: node .github/scripts/post-dependency-review.mjs
